<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Foresight Overlay</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            overflow: hidden;
            pointer-events: none;
        }
        
        #overlay-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="overlay-canvas"></canvas>
    <script>
        // ChatGPT anti-flicker implementation: Canvas with requestAnimationFrame
        const canvas = document.getElementById('overlay-canvas');
        const ctx = canvas.getContext('2d');
        
        // ChatGPT recommendation: Store detections in ref-like structure
        let currentDetections = [];
        let animationId = null;
        let needsRedraw = true;
        let lastDrawTime = 0;
        const maxFpsMs = 33; // cap ~30 FPS redraws
        
        // Detection coordinates are relative to the captured window/frame.
        // The overlay window is positioned and sized to match the capture,
        // so we can draw boxes directly without additional region mapping.
        
        // Account for devicePixelRatio to align physical detection coords
        let dpr = window.devicePixelRatio || 1;
        function resizeCanvas() {
            dpr = window.devicePixelRatio || 1;
            // Canvas resolution in physical pixels, but CSS size stays full window
            canvas.style.width = '100vw';
            canvas.style.height = '100vh';
            canvas.width = Math.round(window.innerWidth * dpr);
            canvas.height = Math.round(window.innerHeight * dpr);
            needsRedraw = true;
            requestRedraw();
        }
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        // ChatGPT recommendation: Draw function with requestAnimationFrame
        function drawDetections() {
            const now = Date.now();
            // Throttle redraws and skip if nothing changed
            if (!needsRedraw && (now - lastDrawTime) < maxFpsMs) {
                animationId = null;
                return;
            }
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw current detections
            if (currentDetections && currentDetections.length > 0) {
                ctx.strokeStyle = '#00ff00';
                ctx.lineWidth = 2;
                ctx.fillStyle = '#00ff00';
                ctx.font = '14px Arial';
                
                currentDetections.forEach(detection => {
                    // Handle both old format (coords array) and new format (x1, y1, x2, y2)
                    let x1, y1, x2, y2;
                    if (detection.coords && detection.coords.length >= 4) {
                        [x1, y1, x2, y2] = detection.coords;
                    } else if (detection.x1 !== undefined) {
                        x1 = detection.x1;
                        y1 = detection.y1;
                        x2 = detection.x2;
                        y2 = detection.y2;
                    } else {
                        return; // Skip invalid detection
                    }
                    
                    // Convert physical pixel coordinates to CSS pixels for drawing
                    x1 = x1 / dpr;
                    y1 = y1 / dpr;
                    x2 = x2 / dpr;
                    y2 = y2 / dpr;

                    // Clamp to visible bounds to avoid drawing artifacts
                    const cssW = canvas.width / dpr;
                    const cssH = canvas.height / dpr;
                    x1 = Math.max(0, Math.min(cssW, x1));
                    y1 = Math.max(0, Math.min(cssH, y1));
                    x2 = Math.max(0, Math.min(cssW, x2));
                    y2 = Math.max(0, Math.min(cssH, y2));
                    
                    // Only draw if coordinates are within content area
                    if (x1 >= 0 && y1 >= 0 && x2 <= canvas.width && y2 <= canvas.height) {
                        // Draw bounding box
                        ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
                        
                        // Draw label
                        const confidence = detection.confidence || detection.conf || 0;
                        const label = `Person ${confidence.toFixed(2)}`;
                        const textMetrics = ctx.measureText(label);
                        const textHeight = 16;
                        
                        // Background for text
                        ctx.fillStyle = '#00ff00';
                        ctx.fillRect(x1, y1 - textHeight - 2, textMetrics.width + 4, textHeight + 2);
                        
                        // Text
                        ctx.fillStyle = '#000000';
                        ctx.fillText(label, x1 + 2, y1 - 4);
                        
                        // Reset fill style for next box
                        ctx.fillStyle = '#00ff00';
                    }
                });
            }
            
            lastDrawTime = now;
            needsRedraw = false;
            // Stop the loop until next requested redraw
            animationId = null;
        }
        function requestRedraw() {
            if (!animationId) {
                animationId = requestAnimationFrame(drawDetections);
            }
        }
        // Kick off initial draw
        requestRedraw();
        
        // Listen for detection updates from main process
        window.electronAPI?.onDetectionUpdate?.((detections) => {
            currentDetections = detections || [];
            needsRedraw = true;
            requestRedraw();
        });
        
        // Also listen for YOLO detections from the new system
        if (window.require) {
            const { ipcRenderer } = window.require('electron');
            ipcRenderer.on('yolo-detections', (event, detections) => {
                currentDetections = detections || [];
                needsRedraw = true;
                requestRedraw();
            });
        }
        
        // Control instructions removed - using fixed coordinates
        
        // All interactive controls removed - using fixed coordinates
        // Overlay now uses pointer-events: none for better performance
        document.body.style.pointerEvents = 'none';
        
        // Cleanup on window close
        window.addEventListener('beforeunload', () => {
            if (animationId) {
                cancelAnimationFrame(animationId);
            }
        });
    </script>
</body>
</html>
